services:
  postgres:
    image: postgres:16-alpine
    container_name: persistent-ai-video-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow_local_dev
      POSTGRES_DB: flow_studio
    ports:
      - "54329:5432"
    volumes:
      - flow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow_studio"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: persistent-ai-video-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flow
      MINIO_ROOT_PASSWORD: flow_local_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - flow_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 flow flow_local_secret &&
        mc mb --ignore-existing local/flow-relay

volumes:
  flow_postgres_data:
  flow_minio_data:
