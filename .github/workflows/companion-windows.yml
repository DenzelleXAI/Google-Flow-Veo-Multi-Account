name: Windows Companion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - "tests/companion-path-runtime.test.mjs"
      - "package.json"
      - ".github/workflows/companion-windows.yml"

jobs:
  build-windows-companion:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install build dependencies
        run: npm install

      - name: Verify path safety on Windows
        shell: pwsh
        run: node --test tests/companion-path-runtime.test.mjs

      - name: Bundle companion modules
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          npm run companion:bundle
          if (-not (Test-Path ".\dist\companion-sea.mjs")) {
            throw "Bundled companion SEA entry was not created."
          }

      - name: Build standalone companion
        shell: pwsh
        run: |
          $sea = @{
            main = "dist/companion-sea.mjs"
            mainFormat = "module"
            output = "dist/PersistentAIVideoStudioCompanion.exe"
            disableExperimentalSEAWarning = $true
            useSnapshot = $false
            useCodeCache = $false
            execArgvExtension = "none"
          } | ConvertTo-Json
          Set-Content -Path sea-config.json -Value $sea -Encoding UTF8
          node --build-sea sea-config.json

      - name: Verify executable
        shell: pwsh
        run: |
          $output = & .\dist\PersistentAIVideoStudioCompanion.exe --version
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch "Persistent AI Video Studio Companion") {
            throw "Unexpected companion version output."
          }

      - name: Package Windows companion
        shell: pwsh
        run: |
          Remove-Item .\dist\companion-sea.mjs -Force
          Copy-Item companion\windows\install-standalone.ps1 dist\install.ps1
          Copy-Item companion\windows\run-standalone.ps1 dist\run-standalone.ps1
          Copy-Item companion\windows\uninstall-standalone.ps1 dist\uninstall-standalone.ps1
          Copy-Item companion\windows\README-STANDALONE.md dist\README.txt

      - name: Validate package layout
        shell: pwsh
        run: |
          $required = @(
            ".\dist\PersistentAIVideoStudioCompanion.exe",
            ".\dist\install.ps1",
            ".\dist\run-standalone.ps1",
            ".\dist\uninstall-standalone.ps1",
            ".\dist\README.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Standalone companion package is missing $file"
            }
          }
          if (Test-Path ".\dist\companion-sea.mjs") {
            throw "Build-only bundle should not ship in the companion artifact."
          }

      - name: Upload standalone companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: Persistent-AI-Video-Studio-Companion-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 30
